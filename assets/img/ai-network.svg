<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">Dirbtinio intelekto tinklas</title>
  <desc id="desc">Abstrakti neuroninio tinklo ir susietų duomenų taškų iliustracija.</desc>
  <defs>
